[package]
name = "phical"
version = "0.2.0"
edition = "2021"
description = "Phical: Phient's operators. The learned ones — the Fourier neural operator on the circle, the sphere and the anisotropic tie, joint training over a table of functions, the relation operators (laws, closure, inheritance) and Liskov's better/worse/loss — and the exact ones: the Riemann sphere per channel, Möbius maps, the C64/Q64 quantum juncture, winding numbers, heat flow. Built on phinet (the engine) and phifno (the sphere), as neuraloperator is built on torch and torch-harmonics."
license = "MIT"

[lib]
name = "phical"
path = "src/lib.rs"

[dependencies]
num-complex = "0.4"
phistd = { path = "../phistd" }
phifno = { path = "../phifno" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
serde_json = "1.0"
