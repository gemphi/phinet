[package]
name = "phioml"
version = "0.1.0"
edition = "2021"
description = "Phioml, phinet::oml — PhiFly's active vision re-based on Phient's primitives: the AOC signal as a phasor on phistd's c64, resonance as a complex rotation, and the flow field told as rows, so what the eye computes is what the world counts. Ported from gemphi/phi/crates/phi-oml (the portable replacement for CoreML/MLCompute/Metal)."
license = "MIT"

[dependencies]
phistd = { path = "../phistd" }
phiecs = { path = "../phiecs" }
phical = { path = "../phical" }
