[package]
name = "phiora"
version = "0.1.0"
edition = "2021"
description = "phiora - the Rust client of the Phiora service (phiadk/phiora): the first ECS database, read as metadata. It describes a kind before anything acts on it."
license = "MIT"

[lib]
name = "phiora"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
