[package]
name = "phistd"
version = "0.1.0"
edition = "2021"
description = "Phistd, phinet::std — the numbers. A Fourier tensor engine for neural operators on the circle: complex tensors, reverse-mode autograd, a differentiable unitary FFT, Adam, holographic bind/unbind, the sixty-four gates and the phasor ranges. The operators themselves are phifno's and phical's."
license = "MIT"

[lib]
name = "phistd"
path = "src/lib.rs"

[dependencies]
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
