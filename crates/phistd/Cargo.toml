[package]
name = "phistd"
version = "0.1.0"
edition = "2021"
description = "Phistd, phinet::std — the numbers. A Fourier tensor engine for neural operators on the circle: complex tensors, reverse-mode autograd, a differentiable unitary FFT, Fourier neural operators, and holographic bind/unbind — no dependencies beyond num-complex."
license = "MIT"

[lib]
name = "phistd"
path = "src/lib.rs"

[dependencies]
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rayon = "1.8"

[dev-dependencies]
serde_json = "1.0"
