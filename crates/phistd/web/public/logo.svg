<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Phinet — a Fourier tensor engine on the circle</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- the circle every function lives on -->
  <circle cx="64" cy="64" r="58" stroke="url(#g)" stroke-width="3" opacity=".55"/>
  <!-- the phi glyph shared by every phi* mark -->
  <path d="M40 22V106" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <path d="M40 46V70a24 24 0 0 0 48 0V46" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <!-- the spectrum: three modes, the low one strongest -->
