[package]
name = "phiton"
version = "0.1.0"
edition = "2021"
description = "PhiTon: light as Phient's unit system — a phase as a wavelength, a spectral band and a colour, with the fine-structure shift. A child of phinet in the PML family."
license = "MIT OR Apache-2.0"

[dependencies]
# The numbers: the holographic binding (hrr) works on phistd's functions.
phistd = { path = "../phistd" }
serde = { version = "1.0", features = ["derive"] }
# The phase-conjugate mirror saves and loads its spectra (conjugate).
bincode = "1.3"
# Phi-4's byte-level BPE reads its tokenizer.json (p64/bpe).
serde_json = "1.0"
